[project]
name = "birmarket-price-tracker"
version = "0.1.0"
description = "Scrape BirMarket product catalog snapshots for price analysis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pyarrow>=16",
    "truststore>=0.10.4",
]

[project.scripts]
birmarket = "birmarket.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/birmarket"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
